name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          architecture: x64
          package-manager-cache: false

      - name: Enable the pinned package manager
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Verify tag and public-release boundary
        shell: pwsh
        run: |
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw 'Release tags must point to the current main branch head.'
          }
          pnpm run check:release

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks and tests
        run: pnpm run ci

      - name: Prepare optional Authenticode certificate
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Both Windows signing secrets must be configured together.'
          }
          if ($env:REQUIRE_SIGNING -eq 'true' -and -not $hasCertificate) {
            throw 'This release environment requires an Authenticode certificate.'
          }
          if ($hasCertificate) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'desktop-release.pfx'
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
            )
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build Squirrel.Windows artifacts
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm exec electron-forge make --platform=win32 --arch=x64

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $targets = @(
            (Get-ChildItem -Path 'out/*-win32-x64/SplitSquareHarness.exe' -File),
            (Get-ChildItem -LiteralPath 'out/make/squirrel.windows/x64' -File -Filter '*.exe')
          )
          if ($targets.Count -eq 0) {
            throw 'No executable was found for signature verification.'
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature: $($target.FullName) ($($signature.Status))"
            }
          }

      - name: Collect immutable release inputs
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null

          $squirrelDirectory = Join-Path $PWD 'out/make/squirrel.windows/x64'
          $installer = Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter '*.exe'
          $packages = Get-ChildItem -LiteralPath $squirrelDirectory -File -Filter '*.nupkg'
          $releases = Get-Item -LiteralPath (Join-Path $squirrelDirectory 'RELEASES')
          if ($installer.Count -eq 0 -or $packages.Count -eq 0) {
            throw 'Squirrel did not produce the required installer and NuGet package.'
          }
          Copy-Item -LiteralPath @($installer.FullName) -Destination $releaseDirectory
          Copy-Item -LiteralPath @($packages.FullName) -Destination $releaseDirectory
          Copy-Item -LiteralPath $releases.FullName -Destination $releaseDirectory
          Copy-Item -LiteralPath @('LICENSE', 'NOTICE.md', 'THIRD_PARTY_NOTICES.md', 'CHANGELOG.md') -Destination $releaseDirectory

          $portableDirectory = Get-ChildItem -LiteralPath out -Directory | Where-Object Name -Like '*-win32-x64' | Select-Object -First 1
          if (-not $portableDirectory) {
            throw 'Packaged x64 application directory was not found.'
          }
          $portableArchive = Join-Path $releaseDirectory 'SplitSquare-Harness-win32-x64.zip'
          Compress-Archive -Path (Join-Path $portableDirectory.FullName '*') -DestinationPath $portableArchive -CompressionLevel Optimal

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath $env:WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_FILE -Force
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified build outputs
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Export the source dependency SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            --jq '.sbom' > "release-assets/${GITHUB_REF_NAME}.source.spdx.json"

      - name: Generate and verify SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Attest final release bytes
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_assets < <(
            find release-assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z
          )
          ((${#release_assets[@]} > 0)) || {
            echo 'No release assets were found.' >&2
            exit 1
          }

          release_flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" "${release_flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
